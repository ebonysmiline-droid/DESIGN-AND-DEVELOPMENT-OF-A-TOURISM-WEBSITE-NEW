
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign In - Travel World</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(
        rgba(0,0,0,0.5),
        rgba(0,0,0,0.5)
    ),
    url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b");

    background-size: cover;
    background-position: center;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.signin-container {
    background: white;
    width: 380px;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

h1 {
    text-align: center;
    color: #123d57;
    margin-bottom: 10px;
}

h1 span {
    color: #d9a441;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
    color: #123d57;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
}

input:focus {
    border-color: #008b8b;
}

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 15px;
    font-size: 13px;
}

.options label {
    display: flex;
    align-items: center;
    gap: 5px;
    margin: 0;
    font-weight: normal;
}

.options input {
    width: auto;
    margin: 0;
}

a {
    color: #008b8b;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 25px;
    background: #123d57;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #008b8b;
}

.signup {
    text-align: center;
    margin-top: 22px;
    font-size: 14px;
}

.back {
    text-align: center;
    margin-top: 20px;
}

.back a {
    color: #123d57;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="signin-container">

    <h1>TRAVEL <span>WORLD</span></h1>

    <p class="subtitle">
        Welcome Back! Sign in to plan your journey.
    </p>

    <form action="index.html" method="get">

        <label>Email Address</label>
        <input
            type="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            placeholder="Enter your password"
            required
        >

        <div class="options">

            <label>
                <input type="checkbox">
                Remember me
            </label>

            <a href="#">Forgot Password?</a>

        </div>

        <button type="submit">Sign In</button>

    </form>

    <div class="signup">
        Don't have an account?
        <a href="signup.html">Sign Up</a>
    </div>

    <div class="back">
        <a href="http://127.0.0.1:5500/micro%20project%20wt/index.html"> ← Back to Home</a>
    </div>

</div>

</body>
</html>
